name: ordinalgp
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Core ML libraries
  # Versions used by the paper experiments; keep this compatibility trio pinned.
  - tensorflow=2.8.0
  - scikit-learn>=1.0.0
  - numpy>=1.21.0
  - pandas>=1.3.0

  # Statistical libraries
  - scipy>=1.7.0
  - statsmodels>=0.13.0

  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0

  # Utilities
  - tqdm>=4.62.0
  - jupyter
  - ipykernel

  # Development tools
  - pip

  # Install via pip (packages not available in conda)
  - pip:
    - tensorflow-probability==0.16.0
    - gpflow==2.1.3
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0
    - wandb>=0.13.0
    - netcal==1.3.6
    - mord==0.7
